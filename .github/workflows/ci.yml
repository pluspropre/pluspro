name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Forbid the secret Supabase client in client components
        run: |
          if grep -rl "use client" src | xargs grep -l "supabase/admin" ; then echo "secret client imported in a client component"; exit 1; fi
      - run: npm run build
        env:
          CI: 'true'

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations, seed and RLS tests
        run: bash supabase/tests/run_local_harness.sh postgresql://postgres:postgres@localhost:5432/postgres
